name: flutter_crossplatform_app
description: "A modern, responsive, cross-platform Clean Architecture Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0 font

  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Design System
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
